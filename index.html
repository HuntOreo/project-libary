<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./infrastructure/normalize.css">
    <link rel="stylesheet" href="./style.css">
    <title>Library</title>
  </head>

  <body>
    <header>
      <div class="wrapper">
        <h1>Library</h1>
        <button class="showFormBtn">Add</button>
      </div>
    </header>

    <div class="shelf"></div>

    <footer>
      <p>&copy; Hunter Oreair</p>
    </footer>

    <!-- Modals -->
    <div class="form-container add-book-form">
      <form action="" id="book-form">
        <div class="wrapper">
          <label for="title" class="required">Title</label>
          <input type="text" name="title" id="title" required>
        </div>
        <div class="wrapper">
          <label for="author" class="required">Author</label>
          <input type="text" name="author" id="author" required>
        </div>
        <div class="wrapper">
          <label for="publish-date" class="required">Publish Date</label>
          <input type="number" name="publish-date" id="publish-date" required>
        </div>
        <div class="wrapper">
          <label for="cover-link">Cover Link</label>
          <input type="text" name="cover-link" id="cover-link">
        </div>
        <div class="wrapper">
          <label for="read-flag">Read?</label>
          <input type="checkbox" name="readFlag" id="read-flag">
        </div>
        <p>* Required</p>
        <div class="btnWrapper">
          <button class="addBookBtn formBtn" type="submit">Add</button>
          <button class="cancelBtn formBtn" type="button">Cancel</button>
        </div>
      </form>
    </div>

    <div class="form-container update-cover-form">
      <form id="cover-form">
        <div class="wrapper">
          <label for="cover-link">Cover Link</label>
          <input type="text" name="coverLink" id="cover-link">
        </div>
        <div class="btnWrapper">
          <button class="updateCoverBtn formBtn">Update</button>
          <button class="cancelBtn formBtn" type="button">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Book Card Template -->
    <template id="card-template">
      <div class="card">
        <div class="container">
          <div class="wrapper">
            <button class="deleteBtn">Delete</button>
            <label for="">Read</label>
            <input type="checkbox" id="" class="readBtn">
          </div>
          <h2 class="title"></h2>
          <div class="wrapper">
            <img src="" alt="" class="cover">
            <img src="./img/icons/edit-img.svg" alt="cover update icon" class="coverUpdateIcon">
          </div>
          <p class="author"></p>
          <p class="date"></p>
        </div>
      </div>
    </template>

    <!-- App.js -->
    <script src="./script-refactor.js"></script>
  </body>
</html>
